<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#08060e">
  <title>NEON ROULETTE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060e;
      --panel: rgba(19, 13, 31, .9);
      --panel-2: #110b1c;
      --line: rgba(186, 105, 255, .24);
      --purple: #a855f7;
      --violet: #7c3aed;
      --pink: #ec4899;
      --text: #f7efff;
      --muted: #a89ab9;
      --green: #16a36a;
      --red: #d62850;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 12px 32px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(124, 58, 237, .25), transparent 48%),
        radial-gradient(ellipse at 100% 45%, rgba(168, 85, 247, .08), transparent 35%),
        linear-gradient(180deg, #0a0711 0%, #08060e 70%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image: linear-gradient(rgba(177, 113, 255, .14) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(177, 113, 255, .14) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin: 0 2px 18px;
    }
    .brand-wrap { min-width: 0; }
    .brand {
      font-size: clamp(17px, 5vw, 22px); font-weight: 950; letter-spacing: 2.7px;
      line-height: 1.1; text-shadow: 0 0 18px rgba(168,85,247,.38);
    }
    .brand span { color: #d8a7ff; }
    .tagline { margin-top: 5px; color: #867494; font-size: 9px; letter-spacing: 2.5px; }
    .balance {
      flex-shrink: 0; padding: 9px 12px; border: 1px solid rgba(192,132,252,.5);
      border-radius: 11px; background: linear-gradient(135deg, rgba(91,33,182,.22), rgba(17,11,28,.95));
      box-shadow: inset 0 0 18px rgba(168,85,247,.07), 0 0 18px rgba(124,58,237,.1);
      color: #e7c8ff; font-size: 12px; font-weight: 800; white-space: nowrap;
    }
    .balance .diamond { color: #c084fc; margin-right: 5px; }
    .panel {
      position: relative; overflow: hidden; margin-bottom: 14px; padding: 16px;
      border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(145deg, rgba(24,16,39,.96), rgba(12,9,20,.96));
      box-shadow: 0 12px 34px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.025);
    }
    .panel::before {
      content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(192,132,252,.6), transparent);
    }
    .caption {
      color: #a997ba; text-transform: uppercase; letter-spacing: 2px;
      font-size: 9px; text-align: center; font-weight: 800;
    }
    .wheel-wrap {
      width: min(78vw, 318px); aspect-ratio: 1; margin: 16px auto 12px;
      position: relative; isolation: isolate;
    }
    .wheel-wrap::before {
      content: ""; position: absolute; inset: 7%; border-radius: 50%;
      background: #8b2cff; filter: blur(27px); opacity: .2; z-index: -1;
      animation: wheelGlow 3s ease-in-out infinite alternate;
    }
    @keyframes wheelGlow { from { opacity: .13; transform: scale(.96); } to { opacity: .32; transform: scale(1.04); } }
    canvas {
      width: 100%; height: 100%; display: block; border-radius: 50%;
      filter: drop-shadow(0 0 12px rgba(168,85,247,.23)) drop-shadow(0 10px 20px #000a);
    }
    .pointer {
      position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
      z-index: 3; width: 0; height: 0;
      border-left: 11px solid transparent; border-right: 11px solid transparent;
      border-top: 24px solid #f4d7ff;
      filter: drop-shadow(0 0 4px #d8a7ff) drop-shadow(0 0 10px #a855f7);
    }
    .last-result { text-align: center; color: #8f7ca2; font-size: 9px; letter-spacing: 3px; font-weight: 800; }
    .result-number {
      text-align: center; font-size: 34px; line-height: 1.2; font-weight: 950;
      color: #f0d9ff; text-shadow: 0 0 20px rgba(192,132,252,.48);
      font-variant-numeric: tabular-nums;
    }
    .result-number.pop { animation: resultPop .45s cubic-bezier(.2,.8,.2,1); }
    @keyframes resultPop { 0% { transform: scale(.75); opacity: .35; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
    #color-label { margin-top: 4px; min-height: 13px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 13px; }
    button {
      position: relative; color: #fff; border: 1px solid rgba(255,255,255,.09);
      border-radius: 9px; min-height: 38px; font-weight: 800; font-size: 13px;
      cursor: pointer; touch-action: manipulation; transition: transform .14s ease, border-color .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    button:active { transform: scale(.96); }
    button:disabled { cursor: wait; opacity: .62; }
    .num { background: linear-gradient(145deg, #b51f49, #67122d); }
    .black { background: linear-gradient(145deg, #30253d, #17121f); }
    .green { background: linear-gradient(145deg, #159b66, #07583b); }
    .zero { grid-column: span 3; }
    .grid button { box-shadow: inset 0 1px 0 #ffffff13, 0 3px 9px #0003; }
    .grid button:hover { filter: brightness(1.16); }
    .selected {
      outline: 2px solid #d8a7ff; outline-offset: 1px;
      box-shadow: 0 0 0 3px rgba(168,85,247,.13), 0 0 18px rgba(168,85,247,.25) !important;
      z-index: 1;
    }
    .bet-options { display: flex; gap: 8px; margin: 12px 0 18px; }
    .bet-options button { flex: 1; min-height: 43px; }
    .bet-options .num { background: linear-gradient(120deg, #a91d47, #70102f); }
    .bet-options .black { background: linear-gradient(120deg, #33243f, #191321); }
    .bet-options .selected { outline-color: #d8a7ff; }
    .amount-label { margin-bottom: 8px; }
    .amount-row { display: flex; gap: 8px; margin-top: 0; }
    input {
      width: 100%; min-width: 0; color: #f8efff; background: #0a0711;
      border: 1px solid #49315f; border-radius: 10px; padding: 12px;
      font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,.13); }
    .quick-bets { display: flex; gap: 7px; margin-top: 8px; }
    .quick-bets button {
      flex: 1; min-height: 31px; background: rgba(168,85,247,.08);
      border-color: rgba(168,85,247,.22); color: #d8b4fe; font-size: 11px;
    }
    .spin {
      width: 100%; min-height: 50px; margin-top: 13px; border: 1px solid #d8a7ff;
      border-radius: 11px; color: #fff; font-size: 12px; font-weight: 950; letter-spacing: 2px;
      background: linear-gradient(100deg, #6d28d9, #a855f7 52%, #7e22ce);
      box-shadow: 0 0 18px rgba(168,85,247,.24), inset 0 1px 0 #ffffff35;
      text-shadow: 0 1px 3px #3b0764; overflow: hidden;
    }
    .spin::before { content: ""; position: absolute; inset: 0; transform: translateX(-120%); background: linear-gradient(100deg, transparent, #ffffff26, transparent); }
    .spin:not(:disabled):hover::before { animation: buttonSweep .8s ease; }
    @keyframes buttonSweep { to { transform: translateX(120%); } }
    .hint { color: #82718f; font-size: 10px; line-height: 1.6; text-align: center; margin: 12px 0 0; }
    .message { text-align: center; min-height: 22px; margin: 12px 0 0; font-size: 12px; line-height: 1.5; color: #c9b3df; }
    .message.win { color: #d8b4fe; text-shadow: 0 0 12px rgba(168,85,247,.35); }
    .message.lose { color: #d7c8e2; }
    .history { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; margin-top: 13px; min-height: 29px; }
    .history span {
      width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%;
      font-size: 11px; font-weight: 900; border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 0 10px rgba(0,0,0,.25); animation: historyIn .25s ease both;
    }
    @keyframes historyIn { from { opacity: 0; transform: translateY(5px) scale(.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .muted { color: #85728f; }
    .section-head { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .section-head::before, .section-head::after { content: ""; width: 20px; height: 1px; background: #70409b; }
    @media (max-width: 360px) {
      body { padding: 13px 9px 24px; }
      .panel { padding: 13px; border-radius: 15px; }
      .wheel-wrap { width: min(77vw, 280px); }
      .brand { letter-spacing: 1.8px; }
      .balance { padding: 8px 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand-wrap">
      <div class="brand">NEON<span>ROULETTE</span></div>
      <div class="tagline">ENTER THE NIGHT</div>
    </div>
    <div class="balance"><span class="diamond">◆</span><span id="balance">1000</span> CR</div>
  </header>

  <section class="panel">
    <div class="caption section-head">European roulette · 0–36</div>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="600" height="600" aria-label="Колесо рулетки"></canvas>
    </div>
    <div class="last-result">ПОСЛЕДНИЙ РЕЗУЛЬТАТ</div>
    <div class="result-number" id="result">—</div>
    <div class="caption" id="color-label">Сделай свою ставку</div>
  </section>

  <section class="panel">
    <div class="caption section-head">Игровой стол</div>
    <div class="grid" id="numbers">
      <button class="green zero" data-type="number" data-value="0">0</button>
    </div>
    <div class="bet-options">
      <button data-type="color" data-value="red" class="num">🔴 Красное</button>
      <button data-type="color" data-value="black" class="black">⚫ Чёрное</button>
    </div>
    <div class="caption amount-label">Размер ставки · виртуальные кредиты</div>
    <div class="amount-row">
      <input id="amount" type="number" min="1" step="1" value="50" inputmode="numeric" aria-label="Размер ставки">
    </div>
    <div class="quick-bets">
      <button type="button" data-amount="10">+10</button>
      <button type="button" data-amount="50">+50</button>
      <button type="button" data-amount="100">+100</button>
      <button type="button" data-amount="max">MAX</button>
    </div>
    <button class="spin" id="spin">▶ &nbsp; КРУТИТЬ РУЛЕТКУ</button>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <p class="hint">ДЕМО-РЕЖИМ · используются только виртуальные кредиты</p>
  </section>

  <section class="panel">
    <div class="caption section-head">Последние результаты</div>
    <div class="history" id="history"><span class="muted">—</span></div>
  </section>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  if (tg) {
    try {
      tg.setHeaderColor('#08060e');
      tg.setBackgroundColor('#08060e');
    } catch (_) {}
  }

  const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const order = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const slice = TAU / 37;
  let rotation = 0;
  let balance = 1000;
  let selected = { type: 'color', value: 'red' };
  let busy = false;
  let history = [];

  const numbers = document.getElementById('numbers');
  for (let n = 1; n <= 36; n++) {
    const b = document.createElement('button');
    b.className = redNumbers.has(n) ? 'num' : 'black';
    b.textContent = n;
    b.dataset.type = 'number';
    b.dataset.value = n;
    numbers.appendChild(b);
  }

  function drawWheel(angle = rotation) {
    const cx = 300, cy = 300;
    ctx.clearRect(0, 0, 600, 600);

    // Outer neon halo and layered metal rim.
    ctx.save();
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 23;
    ctx.beginPath();
    ctx.arc(cx, cy, 294, 0, TAU);
    ctx.fillStyle = '#8b35d6';
    ctx.fill();
    ctx.restore();

    const rim = ctx.createLinearGradient(30, 40, 570, 560);
    rim.addColorStop(0, '#f0d7ff');
    rim.addColorStop(.18, '#6d28d9');
    rim.addColorStop(.42, '#21132f');
    rim.addColorStop(.68, '#c084fc');
    rim.addColorStop(1, '#3b1761');
    ctx.beginPath();
    ctx.arc(cx, cy, 289, 0, TAU);
    ctx.fillStyle = rim;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 277, 0, TAU);
    ctx.fillStyle = '#0a0710';
    ctx.fill();

    order.forEach((num, i) => {
      const start = -Math.PI / 2 + i * slice + angle;
      const end = start + slice;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, 270, start, end);
      ctx.closePath();

      const grad = ctx.createRadialGradient(cx, cy, 75, cx, cy, 270);
      if (num === 0) {
        grad.addColorStop(0, '#21d99a');
        grad.addColorStop(1, '#07583b');
      } else if (redNumbers.has(num)) {
        grad.addColorStop(0, '#e63e71');
        grad.addColorStop(1, '#70132f');
      } else {
        grad.addColorStop(0, '#453151');
        grad.addColorStop(1, '#100c17');
      }
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(216,167,255,.68)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      const mid = start + slice / 2;
      const tx = cx + Math.cos(mid) * 229;
      const ty = cy + Math.sin(mid) * 229;
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(mid + Math.PI / 2);
      ctx.fillStyle = '#fff5ff';
      ctx.shadowColor = '#d8a7ff';
      ctx.shadowBlur = 7;
      ctx.font = '900 17px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(num, 0, 0);
      ctx.restore();
    });

    // Inner concentric rings.
    ctx.beginPath();
    ctx.arc(cx, cy, 184, 0, TAU);
    ctx.strokeStyle = 'rgba(216,167,255,.28)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const hub = ctx.createRadialGradient(cx - 25, cy - 30, 5, cx, cy, 105);
    hub.addColorStop(0, '#3c2254');
    hub.addColorStop(.58, '#1a1026');
    hub.addColorStop(.86, '#7e22ce');
    hub.addColorStop(1, '#e9c8ff');
    ctx.beginPath();
    ctx.arc(cx, cy, 103, 0, TAU);
    ctx.fillStyle = hub;
    ctx.fill();
    ctx.strokeStyle = '#d8a7ff';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 88, 0, TAU);
    ctx.strokeStyle = 'rgba(216,167,255,.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#f7eaff';
    ctx.shadowColor = '#c084fc';
    ctx.shadowBlur = 16;
    ctx.font = '950 38px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('N', cx, cy - 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#b99bcf';
    ctx.font = '800 8px Arial';
    ctx.fillText('NEON • 00', cx, cy + 28);

    // Small luminous bolts around the rim.
    for (let i = 0; i < 24; i++) {
      const a = i * TAU / 24;
      const x = cx + Math.cos(a) * 281;
      const y = cy + Math.sin(a) * 281;
      ctx.beginPath();
      ctx.arc(x, y, 2.1, 0, TAU);
      ctx.fillStyle = '#f0d7ff';
      ctx.shadowColor = '#a855f7';
      ctx.shadowBlur = 6;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function choose(button) {
    if (busy) return;
    document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('selected'));
    button.classList.add('selected');
    selected = { type: button.dataset.type, value: button.dataset.value };
    const msg = document.getElementById('message');
    msg.className = 'message';
    msg.textContent = selected.type === 'number'
      ? `Выбрано число ${selected.value}`
      : `Выбрано: ${selected.value === 'red' ? 'красное' : 'чёрное'}`;
  }

  document.querySelectorAll('[data-type]').forEach(button => {
    button.addEventListener('click', () => choose(button));
  });
  document.querySelector('[data-value="red"]').classList.add('selected');

  document.querySelectorAll('[data-amount]').forEach(button => {
    button.addEventListener('click', () => {
      if (busy) return;
      const input = document.getElementById('amount');
      const current = Math.max(0, Number(input.value) || 0);
      input.value = button.dataset.amount === 'max'
        ? balance
        : Math.min(balance, current + Number(button.dataset.amount));
    });
  });

  function spinWheel(target, duration = 5200) {
    return new Promise(resolve => {
      const start = rotation;
      const startTime = performance.now();
      const index = order.indexOf(target);
      const desired = -((index + 0.5) * slice);
      const current = ((start % TAU) + TAU) % TAU;
      const targetMod = ((desired % TAU) + TAU) % TAU;
      const extra = 8 * TAU + ((targetMod - current + TAU) % TAU);
      const end = start + extra;

      function frame(now) {
        const t = Math.min(1, (now - startTime) / duration);
        // Smooth launch and long, cinematic ease-out.
        const eased = t < .12
          ? .035 * (t / .12) * (t / .12)
          : .035 + .965 * (1 - Math.pow(1 - (t - .12) / .88, 5));
        rotation = start + (end - start) * eased;
        drawWheel(rotation);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          rotation = end;
          drawWheel(rotation);
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  document.getElementById('spin').addEventListener('click', async () => {
    if (busy) return;
    const amount = Number(document.getElementById('amount').value);
    const msg = document.getElementById('message');

    if (!Number.isSafeInteger(amount) || amount < 1) {
      msg.className = 'message';
      msg.textContent = 'Введите целую ставку от 1.';
      return;
    }
    if (amount > balance) {
      msg.className = 'message';
      msg.textContent = 'Недостаточно виртуальных кредитов.';
      return;
    }

    busy = true;
    const spinButton = document.getElementById('spin');
    spinButton.disabled = true;
    spinButton.textContent = '◌  КОЛЕСО ВРАЩАЕТСЯ…';
    msg.className = 'message';
    msg.textContent = 'Удача уже в движении…';
    balance -= amount;
    document.getElementById('balance').textContent = balance;

    // Demo mode only: result is random and calculated in the browser.
    const result = Math.floor(Math.random() * 37);
    await spinWheel(result);

    const color = result === 0 ? 'green' : redNumbers.has(result) ? 'red' : 'black';
    const won = selected.type === 'number'
      ? result === Number(selected.value)
      : selected.value === color;

    const payout = won ? amount * (selected.type === 'number' ? 36 : 2) : 0;
    balance += payout;
    document.getElementById('balance').textContent = balance;
    const resultEl = document.getElementById('result');
    resultEl.textContent = result;
    resultEl.classList.remove('pop');
    void resultEl.offsetWidth;
    resultEl.classList.add('pop');
    document.getElementById('color-label').textContent =
      color === 'green' ? 'ЗЕРО · ЗЕЛЁНОЕ' : color === 'red' ? 'КРАСНОЕ' : 'ЧЁРНОЕ';

    msg.className = `message ${won ? 'win' : 'lose'}`;
    msg.textContent = won
      ? `✦ ПОБЕДА · Выплата ${payout} CR`
      : `Раунд завершён · −${amount} CR`;

    history.unshift({ result, color });
    history = history.slice(0, 10);
    document.getElementById('history').innerHTML = history.map(item =>
      `<span style="background:${item.color === 'green' ? 'linear-gradient(145deg,#159b66,#07583b)' : item.color === 'red' ? 'linear-gradient(145deg,#b51f49,#67122d)' : 'linear-gradient(145deg,#30253d,#17121f)'}">${item.result}</span>`
    ).join('');

    busy = false;
    spinButton.disabled = false;
    spinButton.textContent = '▶  КРУТИТЬ РУЛЕТКУ';
  });

  drawWheel();
</script>
</body>
</html>
